version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10.26.1
        - pnpm install
    build:
      commands:
        - export PORT=3000
        - export BASE_PATH=/
        - export NODE_ENV=production
        - pnpm --filter @workspace/yo-snacks run build
  artifacts:
    baseDirectory: artifacts/yo-snacks/dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.pnpm-store/**/*
