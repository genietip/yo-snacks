version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - PORT=3000 BASE_PATH=/ pnpm --filter @workspace/yo-snacks run build
  artifacts:
    baseDirectory: artifacts/yo-snacks/dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - artifacts/yo-snacks/node_modules/**/*
      - ~/.pnpm-store/**/*
