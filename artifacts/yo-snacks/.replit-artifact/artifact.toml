kind = "web"
previewPath = "/"
title = "Yo-Snacks"
version = "1.0.0"
id = "artifacts/yo-snacks"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19623

[services.development]
run = "pnpm --filter @workspace/yo-snacks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yo-snacks", "run", "build" ]
publicDir = "artifacts/yo-snacks/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19623"
BASE_PATH = "/"
